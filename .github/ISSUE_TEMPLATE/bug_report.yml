name: Bug report
description: Report a reproducible problem with the site or API.
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the page, actions, or request needed to reproduce it.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add a screenshot, error message, or relevant logs. Remove secrets and personal data.
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, or runtime version, if relevant.
    validations:
      required: false
