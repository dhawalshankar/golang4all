name: Feature request
description: Suggest an improvement for learning, content discovery, or the community.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the need or friction you have encountered.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe the behavior or outcome you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
    validations:
      required: false
